name: Godot 4.7 project check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and startup check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17 for Android Gradle builds
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.1-stable

      - name: Show Godot version
        run: godot --version

      - name: Validate Play Store export configuration
        run: python3 tests/export_config_smoke.py

      - name: Validate privacy and Data Safety inventory
        run: python3 tests/privacy_docs_smoke.py

      - name: Validate release credential hygiene
        run: python3 tests/release_hygiene_smoke.py

      - name: Validate Play Store identity and assets
        run: python3 tests/store_metadata_smoke.py

      - name: Validate iOS release baseline
        run: python3 tests/ios_export_smoke.py

      - name: Validate Android production wiring
        run: python3 tests/android_release_wiring_smoke.py

      - name: Validate project data, resources and translations
        run: python3 tests/project_integrity_smoke.py

      - name: Validate localization coverage of UI literals
        run: python3 tests/localization_usage_smoke.py

      - name: Validate fantasy world and progressive onboarding
        run: python3 tests/fantasy_onboarding_smoke.py

      - name: Validate fair monetization pacing
        run: python3 tests/monetization_pacing_smoke.py

      - name: Enforce source asset performance budgets
        run: python3 tests/performance_budget_smoke.py

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee godot-import.log

      - name: Validate save integrity and autoload graph
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/save_integrity_smoke.gd 2>&1 | tee godot-save-smoke.log

      - name: Fuzz hostile legacy save values
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/state_sanitization_smoke.gd 2>&1 | tee godot-state-sanitization.log

      - name: Validate no-scroll mobile layouts and touch targets
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://tests/ui_layout_smoke.tscn 2>&1 | tee godot-ui-layout.log

      - name: Run 30-minute economy stress simulation
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . res://tests/sim.tscn 2>&1 | tee godot-sim.log

      - name: Start project briefly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee godot-start.log

      - name: Build Android debug APK with native plugins
        shell: bash
        run: |
          set -o pipefail
          mkdir -p export
          godot --headless --path . --install-android-build-template \
            --export-debug "Android" export/ArcaneTradeEmpire-ci.apk \
            2>&1 | tee godot-android-apk.log
          python3 tests/android_package_smoke.py export/ArcaneTradeEmpire-ci.apk

      - name: Build Android release AAB with native plugins
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . \
            --export-release "Android AAB (Play Store)" export/ArcaneTradeEmpire-ci.aab \
            2>&1 | tee godot-android-aab.log
          python3 tests/android_package_smoke.py export/ArcaneTradeEmpire-ci.aab

      - name: Enforce Android package size budgets
        run: |
          python3 tests/performance_budget_smoke.py \
            export/ArcaneTradeEmpire-ci.apk \
            export/ArcaneTradeEmpire-ci.aab

      - name: Fail on parser or script errors
        shell: bash
        run: |
          if grep -Eiq "Parse Error|SCRIPT ERROR|Used tab character|Cannot infer the type" \
              godot-import.log godot-start.log godot-save-smoke.log godot-sim.log \
              godot-state-sanitization.log godot-ui-layout.log godot-android-apk.log godot-android-aab.log; then
            echo "Godot reported a parser or script error."
            grep -Ein "Parse Error|SCRIPT ERROR|Used tab character|Cannot infer the type" \
              godot-import.log godot-start.log godot-save-smoke.log godot-sim.log \
              godot-state-sanitization.log godot-ui-layout.log godot-android-apk.log godot-android-aab.log
            exit 1
          fi
          echo "Godot project check passed."

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-check-logs
          path: |
            godot-import.log
            godot-start.log
            godot-save-smoke.log
            godot-state-sanitization.log
            godot-sim.log
            godot-ui-layout.log
            godot-android-apk.log
            godot-android-aab.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable Android test packages
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: arcane-trade-empire-android-ci
          path: |
            export/ArcaneTradeEmpire-ci.apk
            export/ArcaneTradeEmpire-ci.aab
          if-no-files-found: error
          retention-days: 7
