name: Godot 4.7 project check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and startup check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.1-stable

      - name: Show Godot version
        run: godot --version

      - name: Validate Play Store export configuration
        run: python3 tests/export_config_smoke.py

      - name: Validate privacy and Data Safety inventory
        run: python3 tests/privacy_docs_smoke.py

      - name: Validate release credential hygiene
        run: python3 tests/release_hygiene_smoke.py

      - name: Validate Play Store identity and assets
        run: python3 tests/store_metadata_smoke.py

      - name: Validate iOS release baseline
        run: python3 tests/ios_export_smoke.py

      - name: Validate Android production wiring
        run: python3 tests/android_release_wiring_smoke.py

      - name: Validate project data, resources and translations
        run: python3 tests/project_integrity_smoke.py

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee godot-import.log

      - name: Validate save integrity and autoload graph
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/save_integrity_smoke.gd 2>&1 | tee godot-save-smoke.log

      - name: Run 30-minute economy stress simulation
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . res://tests/sim.tscn 2>&1 | tee godot-sim.log

      - name: Start project briefly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee godot-start.log

      - name: Fail on parser or script errors
        shell: bash
        run: |
          if grep -Eiq "Parse Error|SCRIPT ERROR|Used tab character|Cannot infer the type" \
              godot-import.log godot-start.log godot-save-smoke.log godot-sim.log; then
            echo "Godot reported a parser or script error."
            grep -Ein "Parse Error|SCRIPT ERROR|Used tab character|Cannot infer the type" \
              godot-import.log godot-start.log godot-save-smoke.log godot-sim.log
            exit 1
          fi
          echo "Godot project check passed."

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-check-logs
          path: |
            godot-import.log
            godot-start.log
            godot-save-smoke.log
            godot-sim.log
          if-no-files-found: ignore
          retention-days: 7
